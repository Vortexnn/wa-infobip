<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Infobip Панель</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #e2e8f0; display: flex; height: 100vh; overflow: hidden; }
    .nav-rail { width: 56px; background: #0b1120; border-right: 1px solid #1e293b; display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 16px; }
    .nav-btn { width: 38px; height: 38px; border-radius: 10px; border: none; background: #1e293b; color: #94a3b8; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .nav-btn.active { background: #3b82f6; color: #fff; }
    .sidebar { width: 320px; background: #131c31; border-right: 1px solid #1e293b; display: flex; flex-direction: column; }
    .search-box { padding: 14px; }
    .search-box input { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 20px; padding: 9px 14px; color: #f8fafc; outline: none; font-size: 14px; }
    .new-chat-bar { padding: 0 14px 12px; display: flex; gap: 6px; }
    .new-chat-bar input { flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 7px 10px; color: #fff; font-size: 13px; }
    .new-chat-bar button { background: #3b82f6; border: none; border-radius: 8px; color: #fff; padding: 0 12px; cursor: pointer; font-weight: 600; }
    .chat-list { flex: 1; overflow-y: auto; padding: 0 8px; }
    .chat-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; cursor: pointer; margin-bottom: 4px; }
    .chat-item:hover { background: #1e293b; }
    .chat-item.active { background: #263552; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #3b82f6; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; flex-shrink: 0; }
    .chat-meta { overflow: hidden; }
    .chat-phone { font-size: 14px; font-weight: 600; color: #f1f5f9; }
    .chat-preview { font-size: 12px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .account-footer { padding: 12px 14px; border-top: 1px solid #1e293b; background: #0f172a; display: flex; align-items: center; gap: 10px; }
    .badge-live { background: #16a34a; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
    .main-chat { flex: 1; display: flex; flex-direction: column; background: #0f172a; }
    .chat-header { height: 60px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; padding: 0 20px; font-weight: 600; background: #131c31; }
    .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 65%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; position: relative; }
    .msg.in { background: #1e293b; align-self: flex-start; border-bottom-left-radius: 2px; }
    .msg.out { background: #2563eb; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg-time { font-size: 10px; opacity: 0.7; text-align: right; margin-top: 4px; }
    .input-area { padding: 14px 20px; background: #131c31; border-top: 1px solid #1e293b; display: flex; gap: 10px; }
    .input-area input { flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 11px 14px; color: #fff; outline: none; font-size: 14px; }
    .input-area button { background: #3b82f6; border: none; border-radius: 10px; color: #fff; padding: 0 20px; font-weight: 600; cursor: pointer; }
    .input-area button:hover { background: #2563eb; }
    .empty-state { margin: auto; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <div class="nav-rail">
    <button class="nav-btn active" title="Чаты">💬</button>
    <button class="nav-btn" title="Новый чат" onclick="document.getElementById('newPhone').focus()">+</button>
  </div>
  <div class="sidebar">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Поиск по номеру..." oninput="renderChatList()" />
    </div>
    <div class="new-chat-bar">
      <input type="text" id="newPhone" placeholder="Номер (напр. 380991234567)" />
      <button onclick="startNewChat()">Чат</button>
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="account-footer">
      <div class="avatar" style="width:32px;height:32px;font-size:13px;">IB</div>
      <div>
        <div style="font-size:13px;font-weight:600;">Infobip WA <span class="badge-live">LIVE</span></div>
        <div style="font-size:11px;color:#94a3b8;">eekeer.api.infobip.com</div>
      </div>
    </div>
  </div>
  <div class="main-chat">
    <div class="chat-header" id="chatHeader">Выберите или начните чат</div>
    <div class="messages" id="messagesBox">
      <div class="empty-state">Введите номер телефона слева, чтобы написать в WhatsApp,<br>или дождитесь входящего сообщения.</div>
    </div>
    <form class="input-area" onsubmit="sendMessage(event)">
      <input type="text" id="msgInput" placeholder="Напишите сообщение..." autocomplete="off" />
      <button type="submit">Отправить</button>
    </form>
  </div>
  <script>
    let allChats = {};
    let activePhone = null;

    async function loadChats() {
      try {
        const res = await fetch('/api/chats');
        allChats = await res.json();
        renderChatList();
        if (activePhone) renderMessages();
      } catch (e) { console.error(e); }
    }

    function startNewChat() {
      const raw = document.getElementById('newPhone').value.replace(/\D/g, '');
      if (!raw) return;
      if (!allChats[raw]) allChats[raw] = [];
      activePhone = raw;
      document.getElementById('newPhone').value = '';
      renderChatList();
      renderMessages();
    }

    function renderChatList() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const list = document.getElementById('chatList');
      list.innerHTML = '';
      Object.keys(allChats).filter(p => p.includes(query)).forEach(phone => {
        const msgs = allChats[phone];
        const lastText = msgs.length ? msgs[msgs.length - 1].text : 'Новый диалог';
        const div = document.createElement('div');
        div.className = 'chat-item' + (phone === activePhone ? ' active' : '');
        div.onclick = () => { activePhone = phone; renderChatList(); renderMessages(); };
        div.innerHTML = `
          <div class="avatar">+</div>
          <div class="chat-meta">
            <div class="chat-phone">+${phone}</div>
            <div class="chat-preview">${lastText}</div>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function renderMessages() {
      document.getElementById('chatHeader').textContent = activePhone ? `+${activePhone}` : 'Выберите чат';
      const box = document.getElementById('messagesBox');
      box.innerHTML = '';
      const msgs = allChats[activePhone] || [];
      msgs.forEach(m => {
        const div = document.createElement('div');
        div.className = 'msg ' + m.direction;
        div.innerHTML = `${m.text}<div class="msg-time">${m.time}</div>`;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!activePhone || !text) return;
      input.value = '';
      const res = await fetch('/api/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ to: activePhone, text })
      });
      const data = await res.json();
      if (!res.ok) {
        alert('Ошибка отправки Infobip: ' + JSON.stringify(data.error));
      } else {
        await loadChats();
      }
    }

    setInterval(loadChats, 3000);
    loadChats();
  </script>
</body>
</html>
